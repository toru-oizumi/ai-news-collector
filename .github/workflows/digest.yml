name: Generate Grounded Summaries

on:
  workflow_call:
    inputs:
      checkpoint_artifact:
        type: string
        default: ""
        required: false
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ai-news-state-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: .runtime
          key: pipeline-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}-digest
          restore-keys: pipeline-${{ github.ref_name }}-
      # Same-run handoff uses the collector artifact, never an older cache entry.
      - uses: actions/download-artifact@v4
        id: handoff
        if: ${{ inputs.checkpoint_artifact != '' }}
        with:
          name: ${{ inputs.checkpoint_artifact }}
          path: .runtime
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Missing Chromium becomes body_unavailable, never a title-only summary.
      - name: Install Playwright Chromium
        timeout-minutes: 3
        continue-on-error: true
        run: npx playwright install chromium --with-deps
      - name: Enrich saved pages (10 articles / 12 minutes maximum)
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: npm run digest
      - uses: actions/cache/save@v4
        if: ${{ always() && (inputs.checkpoint_artifact == '' || steps.handoff.outcome == 'success') }}
        with:
          path: .runtime
          key: pipeline-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}-digest
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (inputs.checkpoint_artifact == '' || steps.handoff.outcome == 'success') }}
        with:
          name: enrichment-checkpoint-${{ github.run_attempt }}
          path: .runtime/*.json
          include-hidden-files: true
          retention-days: 30
