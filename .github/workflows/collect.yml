name: Collect AI News

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Serialise collectors: Notion has no unique URL constraint. Do not cancel an
# in-flight save or overwrite its checkpoint with a newer concurrent run.
concurrency:
  group: ai-news-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ai-news-state-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      ready: ${{ steps.collect.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: .runtime
          key: pipeline-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}-collect
          restore-keys: pipeline-${{ github.ref_name }}-
      - name: Save raw articles (no Mistral or Slack calls)
        id: collect
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run collect
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .runtime
          key: pipeline-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}-collect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-checkpoint-${{ github.run_attempt }}
          path: .runtime/*.json
          include-hidden-files: true
          retention-days: 30

  digest:
    needs: collect
    if: ${{ !cancelled() && needs.collect.outputs.ready == 'true' }}
    uses: ./.github/workflows/digest.yml
    secrets: inherit

  publish:
    needs: [collect, digest]
    # A failed enrichment must not suppress a snapshot of already saved articles.
    if: ${{ !cancelled() && needs.collect.outputs.ready == 'true' }}
    uses: ./.github/workflows/publish.yml
    secrets: inherit
