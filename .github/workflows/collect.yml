name: Collect AI News

on:
  schedule:
    # Every 6 hours: 00:00 / 06:00 / 12:00 / 18:00 UTC
    #                09:00 / 15:00 / 21:00 / 03:00 JST
    - cron: "0 */6 * * *"
  workflow_dispatch: # Manual trigger

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run collector
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # Optional Slack digest — leave the secrets unset to disable.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: npm run collect

  # Run digest generation immediately after a successful collect, on its own
  # runner (independent 45-min timeout). Chaining it here — instead of a separate
  # scheduled workflow — keeps digest.yml free of a `schedule` trigger, which
  # GitHub was auto-disabling for inactivity and silently halting digests.
  digest:
    needs: collect
    uses: ./.github/workflows/digest.yml
    secrets: inherit
